<!-- ALTERNATE ICON A, not wired in: swap the two icon-*.png in the manifest for
     the ones rendered from this file, and point the favicon at horizon-tab.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b3a86"/>
      <stop offset=".38" stop-color="#8d5a9e"/>
      <stop offset=".68" stop-color="#e0748f"/>
      <stop offset="1" stop-color="#ffa871"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff6d8" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#ffd08a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffb070" stop-opacity="0"/>
    </radialGradient>
    <!-- the rule is lit from the sun outwards, and fades to nothing at both ends -->
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".26" stop-color="#fff" stop-opacity=".8"/>
      <stop offset=".6" stop-color="#fff9e6" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="316" cy="292" r="140" fill="url(#glow)"/>
  <rect x="48" y="286" width="416" height="12" rx="6" fill="url(#rule)"/>
  <circle cx="316" cy="292" r="27" fill="#fff8e4"/>
</svg>
