<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6ecf7">
  <title>Mes tâches</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <!-- apply saved theme before paint to avoid a color flash -->
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem("todoAppData"));
      if (saved && saved.settings && saved.settings.theme) {
        var t = saved.settings.theme;
        if (t === "auto") {
          var h = new Date().getHours();
          t = h >= 5 && h < 8 ? "dawn" : h >= 8 && h < 18 ? "day" : h >= 18 && h < 21 ? "dusk" : "night";
        }
        document.documentElement.setAttribute("data-theme", t);
      }
      if (saved && saved.settings && saved.settings.palette) {
        document.documentElement.setAttribute("data-palette", saved.settings.palette);
      }
    } catch (err) {}
  </script>
</head>
<body>

  <!-- time-of-day background gradient / stars -->
  <div id="sky"></div>
  <!-- activatable decorations (particles / petals / cats / …) -->
  <div id="decor"></div>

  <!-- settings button, always visible top-right -->
  <button id="notesBtn" class="notes-btn" type="button" data-i18n-aria="notesToolAria" aria-label="Prise de notes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
  </button>
  <button id="settingsBtn" class="settings-btn" data-i18n-aria="settingsAria" aria-label="Paramètres">⚙</button>

  <!-- welcome screen -->
  <section id="welcome" class="welcome">
    <div id="rosace" class="rosace" aria-hidden="true"><div class="rosace__spin"></div></div>
    <div class="welcome__inner">
      <h1 class="welcome__title"><span id="welcomeGreeting"></span><br><span id="welcomeTime" class="welcome__time"></span></h1>
      <button id="enterBtn" class="enter" data-i18n-aria="enterAria" aria-label="Entrer dans l'application">
        <span class="enter__arrow">→</span>
      </button>
    </div>
  </section>

  <!-- app -->
  <main id="app" class="app" hidden>

    <!-- daily tasks -->
    <section class="panel">
      <h2 class="panel__title" data-i18n="tasksTitle">Vos tâches du jour</h2>
      <form class="add" data-list="tasks">
        <input class="add__input" type="text" data-i18n-placeholder="addTaskPlaceholder" data-i18n-aria="taskInputAria"
               placeholder="Ajouter une tâche…" aria-label="Nouvelle tâche" required>
        <button class="add__btn" type="submit" data-i18n-aria="addAria" aria-label="Ajouter">+</button>
      </form>
      <ul class="list" id="tasksList"></ul>
    </section>

    <!-- projects -->
    <section class="panel">
      <h2 class="panel__title" data-i18n="projectsTitle">Vos projets</h2>
      <form class="add" data-list="projects">
        <input class="add__input" type="text" data-i18n-placeholder="addProjectPlaceholder" data-i18n-aria="projectInputAria"
               placeholder="Ajouter un projet…" aria-label="Nouveau projet" required>
        <button class="add__btn" type="submit" data-i18n-aria="addAria" aria-label="Ajouter">+</button>
      </form>
      <ul class="list" id="projectsList"></ul>
    </section>

    <!-- habits -->
    <section class="panel">
      <div class="panel__head">
        <h2 class="panel__title" data-i18n="habitsTitle">Vos habitudes</h2>
        <button class="panel__action" id="habitsViewBtn" type="button" data-i18n-aria="habitsHistoryAria" aria-label="Suivi des habitudes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </button>
      </div>
      <div class="habits" id="habitsGrid"></div>
    </section>

    <!-- focus mode entry -->
    <section class="panel focus-card">
      <button id="focusBtn" class="focus-trigger" type="button" data-i18n-aria="focusAria" aria-label="Passer en mode focus">
        <svg class="fleur" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M32 8 C 27 18, 27 28, 32 36 C 37 28, 37 18, 32 8 Z"/>
          <path d="M32 36 C 24 33, 16 25, 20 15 C 22 24, 28 31, 33 35"/>
          <path d="M32 36 C 40 33, 48 25, 44 15 C 42 24, 36 31, 31 35"/>
          <path d="M24 35 C 28 38, 36 38, 40 35"/>
          <path d="M32 36 C 29 44, 29 50, 32 56 C 35 50, 35 44, 32 36 Z"/>
          <path d="M26 54 C 29 51, 35 51, 38 54"/>
        </svg>
        <span class="focus-label" data-i18n="focusLabel">Mode focus</span>
      </button>
    </section>

  </main>

  <!-- task/project detail view -->
  <div id="detail" class="detail" hidden>
    <div class="detail__bar">
      <button id="detailBack" class="detail__back" type="button" data-i18n-aria="backAria" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button id="detailPin" class="detail__pin" type="button" data-i18n-aria="pinLabel" aria-label="Épingler">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="6" r="3"/><circle cx="17.7" cy="10.15" r="3"/><circle cx="15.5" cy="16.85" r="3"/><circle cx="8.47" cy="16.85" r="3"/><circle cx="6.3" cy="10.15" r="3"/><circle cx="12" cy="12" r="2.2"/></svg>
      </button>
    </div>
    <div class="detail__body">
      <input id="detailName" class="detail__name" type="text" maxlength="120">
      <div id="detailProps" class="detail__props"></div>

      <div class="detail__section">
        <span class="detail__label" data-i18n="notesLabel">Notes</span>
        <textarea id="detailNotes" class="detail__notes" rows="4" data-i18n-placeholder="notesPlaceholder" placeholder="Ajouter des notes…"></textarea>
      </div>

      <div class="detail__section" id="subtaskSection">
        <span class="detail__label" data-i18n="subtasksLabel">Sous-tâches</span>
        <form id="subtaskForm" class="sub-add">
          <input id="subtaskInput" class="add__input" type="text" data-i18n-placeholder="addSubtaskPlaceholder" placeholder="Ajouter une sous-tâche…" required>
          <button class="add__btn" type="submit" data-i18n-aria="addAria" aria-label="Ajouter">+</button>
        </form>
        <ul id="subtaskList" class="list"></ul>
      </div>

      <div class="detail__section" id="timelineSection" hidden>
        <span class="detail__label" data-i18n="milestonesLabel">Jalons</span>
        <div id="timeline" class="timeline"></div>
      </div>

      <button id="detailDelete" class="detail__delete" type="button" data-i18n="deleteAria">Supprimer</button>
    </div>
  </div>

  <!-- focus overlay -->
  <div id="focus" class="focus" hidden>
    <img id="scubaGif" class="scuba-gif" src="./assets/cat-scuba.gif" alt="" hidden>
    <div class="focus__dot"></div>
    <p class="focus__phrase" id="focusPhrase"></p>
    <button id="focusExit" class="focus__exit" type="button" data-i18n-aria="focusExitAria" aria-label="Quitter le mode focus">×</button>
  </div>

  <!-- settings dialog -->
  <div id="settings" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card">
      <div class="modal__head">
        <h2 class="modal__title" data-i18n="settingsTitle">Paramètres</h2>
        <button class="modal__close" data-close data-i18n-aria="closeAria" aria-label="Fermer">×</button>
      </div>

      <label class="field">
        <span class="field__label" data-i18n="nameLabel">Votre prénom</span>
        <input id="nameInput" class="field__input" type="text" data-i18n-placeholder="namePlaceholder"
               placeholder="Ex. Aymane" maxlength="30">
      </label>

      <div class="field">
        <span class="field__label" data-i18n="themeLabel">Thème</span>
        <div class="themes" id="themes">
          <button class="theme" data-theme="light" data-i18n="themeLight" type="button">Clair</button>
          <button class="theme" data-theme="dark" data-i18n="themeDark" type="button">Sombre</button>
          <button class="theme" data-theme="rose" data-i18n="themeRose" type="button">Rose</button>
          <button class="theme" data-theme="auto" data-i18n="themeAuto" type="button">Adaptatif</button>
          <button class="theme" data-theme="dawn" data-i18n="themeDawn" type="button">Aube</button>
          <button class="theme" data-theme="day" data-i18n="themeDay" type="button">Jour</button>
          <button class="theme" data-theme="dusk" data-i18n="themeDusk" type="button">Crépuscule</button>
          <button class="theme" data-theme="night" data-i18n="themeNight" type="button">Nuit</button>
        </div>
      </div>

      <div class="field">
        <span class="field__label" data-i18n="paletteLabel">Palette</span>
        <div class="palettes" id="palettes">
          <button class="palette" data-palette="aurora" type="button">
            <span class="palette__sw"></span><span data-i18n="paletteAurora">Aurore</span>
          </button>
          <button class="palette" data-palette="meadow" type="button">
            <span class="palette__sw"></span><span data-i18n="paletteMeadow">Prairie</span>
          </button>
          <button class="palette" data-palette="sunset" type="button">
            <span class="palette__sw"></span><span data-i18n="paletteSunset">Coucher</span>
          </button>
        </div>
      </div>

      <div class="field">
        <span class="field__label" data-i18n="languageLabel">Langue</span>
        <div class="langs" id="langs">
          <button class="lang" data-lang="fr" data-i18n="langFr" type="button">Français</button>
          <button class="lang" data-lang="en" data-i18n="langEn" type="button">English</button>
        </div>
      </div>

      <div class="field">
        <span class="field__label" data-i18n="decorLabel">Décorations</span>
        <div class="decors" id="decors">
          <button class="decor-opt" data-decor="particles" data-i18n="decorParticles" type="button">Particules</button>
          <button class="decor-opt" data-decor="petals" data-i18n="decorPetals" type="button">Pétales</button>
          <button class="decor-opt" data-decor="bubbles" data-i18n="decorBubbles" type="button">Bulles</button>
          <button class="decor-opt" data-decor="fireflies" data-i18n="decorFireflies" type="button">Lucioles</button>
        </div>
      </div>
    </div>
  </div>

  <!-- habit icon picker -->
  <div id="iconPicker" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card">
      <div class="modal__head">
        <h2 class="modal__title" data-i18n="pickIconTitle">Choisir une icône</h2>
        <button class="modal__close" data-close data-i18n-aria="closeAria" aria-label="Fermer">×</button>
      </div>
      <label class="field" id="habitNameField">
        <span class="field__label" data-i18n="habitNameLabel">Nom de l'habitude</span>
        <input id="habitNameInput" class="field__input" type="text" data-i18n-placeholder="habitNamePlaceholder"
               placeholder="Ex. Boire de l'eau" maxlength="40">
      </label>
      <div class="icon-grid" id="iconGrid"></div>
    </div>
  </div>

  <!-- habits management + history -->
  <div id="habitsView" class="detail" hidden>
    <div class="detail__bar">
      <button id="habitsBack" class="detail__back" type="button" data-i18n-aria="backAria" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <div class="detail__body">
      <h2 class="detail__viewtitle" data-i18n="habitsTitle">Vos habitudes</h2>
      <div id="habitsViewBody"></div>
    </div>
  </div>

  <!-- notes: list of titles -->
  <div id="notes" class="detail" hidden>
    <div class="detail__bar">
      <button id="notesBack" class="detail__back" type="button" data-i18n-aria="backAria" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button id="addNoteBtn" class="notes__add" type="button" data-i18n-aria="addNoteAria" aria-label="Nouvelle note">+</button>
    </div>
    <div class="detail__body">
      <h2 class="detail__viewtitle" data-i18n="notesTitle">Notes</h2>
      <input id="noteSearch" class="note-search" type="text" data-i18n-placeholder="searchPlaceholder" placeholder="Rechercher…" aria-label="Rechercher">
      <div id="notesList" class="notes-list"></div>
    </div>
  </div>

  <!-- notes: single-note editor -->
  <div id="noteEditor" class="detail" hidden>
    <div class="notes__top">
      <div class="detail__bar">
        <button id="noteEditorBack" class="detail__back" type="button" data-i18n-aria="backAria" aria-label="Retour">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
      <div class="notes__toolbar">
        <button class="ntool" data-cmd="bold" data-i18n-aria="boldAria" aria-label="Gras">B</button>
        <button class="ntool" data-cmd="italic" data-i18n-aria="italicAria" aria-label="Italique">I</button>
        <button class="ntool" data-cmd="underline" data-i18n-aria="underlineAria" aria-label="Souligner">U</button>
        <button class="ntool" data-cmd="hilite" data-i18n-aria="highlightAria" aria-label="Surligner">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2" fill="#ffe08a" stroke="none"/></svg>
        </button>
        <span class="ntool__sep"></span>
        <div class="ntool__emojis" id="noteEmojis"></div>
      </div>
    </div>
    <div class="detail__body">
      <input id="noteTitleInput" class="note-title" type="text" data-i18n-placeholder="noteTitlePlaceholder" placeholder="Titre" maxlength="120">
      <div id="noteEditorBody" class="note-body" contenteditable="true"></div>
    </div>
  </div>

  <!-- deadline calendar -->
  <div id="calendar" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card">
      <div class="modal__head">
        <h2 class="modal__title" data-i18n="calendarTitle">Échéance</h2>
        <button class="modal__close" data-close data-i18n-aria="closeAria" aria-label="Fermer">×</button>
      </div>

      <div class="cal">
        <div class="cal__head">
          <button type="button" class="cal__nav" id="calPrev" data-i18n-aria="prevMonthAria" aria-label="Mois précédent">‹</button>
          <span class="cal__month" id="calMonth"></span>
          <button type="button" class="cal__nav" id="calNext" data-i18n-aria="nextMonthAria" aria-label="Mois suivant">›</button>
        </div>
        <div class="cal__grid" id="calGrid"></div>
      </div>

      <label class="field">
        <span class="field__label" data-i18n="calTimeLabel">Heure (optionnel)</span>
        <input id="calTime" class="field__input" type="time">
      </label>

      <div class="cal__actions">
        <button type="button" class="cal__clear" id="calClear" data-i18n="calClear">Effacer</button>
        <button type="button" class="cal__confirm" id="calConfirm" data-i18n="calConfirm">Valider</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
